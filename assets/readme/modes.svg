<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="210" viewBox="0 0 1200 210" role="img" aria-labelledby="title desc">
  <title id="title">Sky Blaster — six game modes</title>
  <desc id="desc">Story, Endless, Boss Rush, Daily, Practice, and Co-op Endless modes, each with a one-line description.</desc>

  <defs>
    <linearGradient id="cardBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d1326"/>
      <stop offset="1" stop-color="#080b18"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="210" rx="20" fill="#060814"/>

  <g font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
    <!-- Story -->
    <g transform="translate(40 30)">
      <rect width="170" height="150" rx="12" fill="url(#cardBg)" stroke="#ffffff" stroke-opacity="0.08"/>
      <rect width="170" height="6" rx="3" fill="#4de8ff"/>
      <text x="18" y="44" font-size="21" font-weight="700" fill="#eaf2ff">Story</text>
      <text x="18" y="74" font-size="13" fill="#9fb0d0">Campaign across</text>
      <text x="18" y="92" font-size="13" fill="#9fb0d0">4 chapters &amp; bosses</text>
    </g>
    <!-- Endless -->
    <g transform="translate(230 30)">
      <rect width="170" height="150" rx="12" fill="url(#cardBg)" stroke="#ffffff" stroke-opacity="0.08"/>
      <rect width="170" height="6" rx="3" fill="#ffb347"/>
      <text x="18" y="44" font-size="21" font-weight="700" fill="#eaf2ff">Endless</text>
      <text x="18" y="74" font-size="13" fill="#9fb0d0">Survive the</text>
      <text x="18" y="92" font-size="13" fill="#9fb0d0">escalating waves</text>
    </g>
    <!-- Boss Rush -->
    <g transform="translate(420 30)">
      <rect width="170" height="150" rx="12" fill="url(#cardBg)" stroke="#ffffff" stroke-opacity="0.08"/>
      <rect width="170" height="6" rx="3" fill="#4de8ff"/>
      <text x="18" y="44" font-size="21" font-weight="700" fill="#eaf2ff">Boss Rush</text>
      <text x="18" y="74" font-size="13" fill="#9fb0d0">Pure boss</text>
      <text x="18" y="92" font-size="13" fill="#9fb0d0">encounters</text>
    </g>
    <!-- Daily -->
    <g transform="translate(610 30)">
      <rect width="170" height="150" rx="12" fill="url(#cardBg)" stroke="#ffffff" stroke-opacity="0.08"/>
      <rect width="170" height="6" rx="3" fill="#ffb347"/>
      <text x="18" y="44" font-size="21" font-weight="700" fill="#eaf2ff">Daily</text>
      <text x="18" y="74" font-size="13" fill="#9fb0d0">One seeded run,</text>
      <text x="18" y="92" font-size="13" fill="#9fb0d0">same for all</text>
    </g>
    <!-- Practice -->
    <g transform="translate(800 30)">
      <rect width="170" height="150" rx="12" fill="url(#cardBg)" stroke="#ffffff" stroke-opacity="0.08"/>
      <rect width="170" height="6" rx="3" fill="#4de8ff"/>
      <text x="18" y="44" font-size="21" font-weight="700" fill="#eaf2ff">Practice</text>
      <text x="18" y="74" font-size="13" fill="#9fb0d0">Learn with</text>
      <text x="18" y="92" font-size="13" fill="#9fb0d0">invincibility</text>
    </g>
    <!-- Co-op Endless -->
    <g transform="translate(990 30)">
      <rect width="170" height="150" rx="12" fill="url(#cardBg)" stroke="#ffb347" stroke-opacity="0.55"/>
      <rect width="170" height="6" rx="3" fill="#ffb347"/>
      <text x="18" y="44" font-size="21" font-weight="700" fill="#eaf2ff">Co-op</text>
      <text x="18" y="68" font-size="16" font-weight="700" fill="#ffb347">Endless</text>
      <text x="18" y="98" font-size="13" fill="#9fb0d0">2P online —</text>
      <text x="18" y="116" font-size="13" fill="#9fb0d0">host + guest</text>
    </g>
  </g>
</svg>
